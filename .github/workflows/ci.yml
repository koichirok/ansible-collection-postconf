name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit, sanity, and collection build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ansible_collections/koichirok/postconf
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: ansible_collections/koichirok/postconf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ansible-core
        run: python -m pip install ansible-core==2.21.5

      - name: Run unit tests
        run: ansible-test units --python 3.13 --requirements

      - name: Run sanity tests
        run: ansible-test sanity --python 3.13 --requirements

      - name: Build collection
        run: ansible-galaxy collection build --output-path "$RUNNER_TEMP"

  linux-integration:
    name: Linux integration (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ansible_collections/koichirok/postconf
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - debian13
          - ubuntu2404
          - rocky9
          - alma9
          - fedora43
          - alpine323
          - ubuntu2204
          - debian12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: ansible_collections/koichirok/postconf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ansible-core
        run: python -m pip install ansible-core==2.21.5

      - name: Run integration targets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: sh tests/integration/run-platforms.sh "$PLATFORM"

  freebsd-integration:
    name: FreeBSD integration (14.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ansible_collections/koichirok/postconf
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: ansible_collections/koichirok/postconf

      - name: Run integration targets in FreeBSD VM
        run: sh tests/integration/run-freebsd.sh
